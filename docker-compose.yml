services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  seed:
    build:
      context: .
      target: builder
    command: sh -c "npm run seed:admin && npm run seed:demo"
    env_file:
      - .env.local
    environment:
      MONGODB_URI: mongodb://mongo:27017/doctor-tracker
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/doctor-tracker
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mongo_data:
